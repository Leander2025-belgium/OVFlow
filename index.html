<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07101f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>OVFlow 2.0</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/styles.css?v=2.0.0" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <button class="brand" data-action="goto" data-tab="home" aria-label="OVFlow home">
        <span class="brand-mark"><i data-lucide="route"></i></span>
        <span><strong>OVFlow</strong><small>2.0</small></span>
      </button>
      <div class="header-actions">
        <button class="location-pill" id="headerLocation" data-action="locate">
          <i data-lucide="locate-fixed"></i><span>Locatie</span>
        </button>
        <button class="round-button" data-action="refresh" aria-label="Vernieuwen"><i data-lucide="refresh-cw"></i></button>
      </div>
    </header>

    <main id="app" class="app-content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Hoofdnavigatie">
      <button class="nav-item active" data-action="goto" data-tab="home"><i data-lucide="house"></i><span>Vandaag</span></button>
      <button class="nav-item" data-action="goto" data-tab="plan"><i data-lucide="route"></i><span>Plannen</span></button>
      <button class="nav-item" data-action="goto" data-tab="live"><i data-lucide="radio-tower"></i><span>Live rit</span></button>
      <button class="nav-item" data-action="goto" data-tab="saved"><i data-lucide="bookmark"></i><span>Bewaard</span></button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="bottom-sheet" id="sheet" hidden aria-modal="true" role="dialog">
    <div class="sheet-handle"></div>
    <div id="sheetContent"></div>
  </section>

  <div class="toast" id="toast" hidden></div>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js?v=2.0.0"></script>
</body>
</html>
